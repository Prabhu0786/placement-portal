<style>
.mi-wrap{max-width:980px;margin:28px auto;padding:0 18px 40px;color:#202b45}
.mi-hero{background:linear-gradient(125deg,#222b65,#5558d8);color:#fff;border-radius:20px;padding:26px 30px;margin-bottom:20px}
.mi-hero h1{margin:0 0 8px;font-size:clamp(1.5rem,3vw,2.05rem)}
.mi-hero p{margin:0;color:#e5e7ff;max-width:720px;line-height:1.65}
.mi-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(250px,.85fr);gap:18px;align-items:start}
.mi-card{background:#fff;border:1px solid #e5e8f1;border-radius:16px;padding:22px;box-shadow:0 8px 25px #1e2b5510;margin-bottom:18px}
.mi-card h2{font-size:1.1rem;margin:0 0 12px}
.mi-field{margin:14px 0}
.mi-field label{display:block;font-weight:700;font-size:.9rem;margin-bottom:5px}
.mi-field input[type=text],.mi-field select,.mi-field textarea{width:100%;padding:10px 12px;border:1px solid #dce1ed;border-radius:10px;font:inherit;background:#fff;color:#202b45}
.mi-field ul{list-style:none;margin:0;padding:0}
.mi-field ul label{font-weight:400;display:flex;gap:8px;align-items:center}
.mi-help{color:#5d6882;font-size:.85rem;margin-top:4px}
.mi-error{color:#b42318;font-size:.88rem;margin:4px 0 0}
.mi-note{background:#eef0ff;border:1px solid #d6dbff;border-radius:12px;padding:12px 14px;font-size:.92rem;line-height:1.55}
.mi-warn{background:#fff8e1;border:1px solid #f1d98a;border-radius:12px;padding:12px 14px;font-size:.92rem}
.mi-q{font-size:1.15rem;font-weight:700;line-height:1.5;margin:6px 0 14px}
.mi-badge{display:inline-block;background:#eef0ff;color:#3b3fb5;border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:700}
.mi-rating{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.88rem}
.mi-r1,.mi-r2{background:#fde2e0;color:#7a1710}.mi-r3{background:#fff0c2;color:#6b4e00}.mi-r4,.mi-r5{background:#d9f2e4;color:#14532d}
.mi-list{margin:6px 0 12px;padding-left:20px;line-height:1.6}
.mi-progress{height:10px;background:#e6eaf2;border-radius:999px;overflow:hidden;margin-top:12px}
.mi-progress span{display:block;height:100%;background:#7cf0c1}
.mi-quote{border-left:4px solid #dce1ed;padding:2px 0 2px 14px;margin:8px 0;white-space:pre-wrap}
.mi-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.mi-hist{width:100%;border-collapse:collapse;font-size:.92rem}
.mi-hist th,.mi-hist td{text-align:left;padding:8px 6px;border-bottom:1px solid #e5e8f1}
details.mi-more{margin:8px 0}details.mi-more summary{cursor:pointer;font-weight:700;color:#3b3fb5}
@media(max-width:760px){.mi-grid{grid-template-columns:1fr}.mi-hero{padding:22px}}
</style>
