{% extends "accounts/base.html" %}
{% block title %}{{ title }} - Placement Prep Portal{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ title }}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form.html" %}
    <button class="btn" type="submit">Save</button>
    <a class="btn secondary" href="{% url cancel_url %}">Cancel</a>
  </form>
</div>
{% endblock %}
