{% extends "accounts/base.html" %}
{% block title %}Choose New Password - Placement Prep Portal{% endblock %}
{% block content %}
<div class="card narrow">
  <span class="tag">NEW PASSWORD</span>
  <h1 style="margin-top:12px">Choose a new password</h1>
  {% if error %}<p class="muted" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_new_password1">New password</label>
    <input id="id_new_password1" type="password" name="new_password1" required autocomplete="new-password"
      style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:8px;margin:8px 0 14px">
    <label for="id_new_password2">Confirm new password</label>
    <input id="id_new_password2" type="password" name="new_password2" required autocomplete="new-password"
      style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:8px;margin:8px 0 16px">
    <button class="btn" type="submit" style="width:100%">Update password →</button>
  </form>
</div>
{% endblock %}
