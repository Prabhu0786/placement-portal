{% extends "accounts/base.html" %}
{% block title %}Edit profile - Placement Prep Portal{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Edit profile</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form.html" %}
    <button class="btn" type="submit">Save</button>
    <a class="btn secondary" href="{% url 'profile' %}">Cancel</a>
  </form>
</div>
{% endblock %}
