{% extends "accounts/base.html" %}
{% block title %}Edit profile - Placement Prep Portal{% endblock %}
{% block content %}
<div class="card narrow">
  <span class="tag">PROFILE SETTINGS</span><h1 style="margin-top:12px">Edit profile</h1>
  <p class="muted">Keep your information up to date for better placement preparation.</p>
  <form method="post" novalidate>{% csrf_token %}{% include "accounts/_form.html" %}
    <div class="actions"><button class="btn" type="submit">Save changes →</button><a class="btn secondary" href="{% url 'profile' %}">Cancel</a></div>
  </form>
</div>
{% endblock %}
